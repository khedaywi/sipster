document.addEventListener('DOMContentLoaded', async function() {
  const loading = document.getElementById('__bundler_loading');
  function setStatus(msg) { if (loading) loading.textContent = msg; }

  const FONT_MIME = /^(font[/]|application[/](x-)?font-|application[/]vnd\.ms-fontobject)/i;
  const MIME_TOKEN = /^[\w.+-]+[/][\w.+-]+$/;
  function toBase64(bytes) {
    let bin = '';
    for (let i = 0; i < bytes.length; i += 0x8000) {
      bin += String.fromCharCode.apply(null, bytes.subarray(i, i + 0x8000));
    }
    return btoa(bin);
  }

  // Error sink persists across replaceWith since it's on window, not the DOM.
  window.addEventListener('error', function(e) {
    // Failed resource loads (CSP-blocked links, scripts, images) fire plain
    // events at the element — warn only; real JS errors carry message/error.
    if (!e.message && !e.error && e.target && e.target !== window) {
      console.warn('[bundle] resource failed to load:',
        e.target.tagName, String(e.target.src || e.target.href || ''));
      return;
    }
    var p = document.body || document.documentElement;
    var d = document.getElementById('__bundler_err') || p.appendChild(document.createElement('div'));
    d.id = '__bundler_err';
    d.style.cssText = 'position:fixed;bottom:12px;left:12px;right:12px;font:12px/1.4 ui-monospace,monospace;background:#2a1215;color:#ff8a80;padding:10px 14px;border-radius:8px;border:1px solid #5c2b2e;z-index:99999;white-space:pre-wrap;max-height:40vh;overflow:auto';

      (e.filename ? ' (' + e.filename.slice(0, 60) + ':' + e.lineno + ')' : '');

    const manifestEl = document.querySelector('script[type="__bundler/manifest"]');
    const templateEl = document.querySelector('script[type="__bundler/template"]');
    if (!manifestEl || !templateEl) {
      setStatus('Error: missing bundle data');
      console.error('[bundler] Missing script tags — manifestEl:', !!manifestEl, 'templateEl:', !!templateEl);
      return;
    }

    const manifest = JSON.parse(manifestEl.textContent);
    let template = JSON.parse(templateEl.textContent);

    // Nested page bundles (iframe targets). Each ships ONCE, in the ROOT
    // document's manifest; frame srcs carry an about:blank#<uuid> marker
    // instead of a substitutable uuid. Every document mints the blobs for
    // its OWN frames — from local text at the root, or text obtained from
    // its DIRECT parent over the relay protocol below — so each frame
    // navigation stays same-origin with its initiator and a deduped page
    // loads at any depth on any host, including a file:// download's
    // opaque origins (where a blob minted by one document cannot be
    // navigated to by another).
    const pageOrderEl = document.querySelector('script[type="__bundler/page_order"]');
    const pageOrder = pageOrderEl ? JSON.parse(pageOrderEl.textContent) : [];
    const pageSet = new Set(pageOrder);
    const pageTexts = {};

    // ── Nested-page text protocol (parent-chain relay) ──
    // Page bundles ship once, in the ROOT document's manifest. Every
    // document mints the blobs for its OWN frames, obtaining page text
    // through a strict parent-chain relay: a document only ever SENDS to
    // its direct parent (which, for every document the publisher's own
    // runtime minted, is another publisher document) and only ACCEPTS
    // text from that direct parent; requests from below are honored only
    // for the document's own child frames, and the ROOT never sends
    // upward at all. That last rule is load-bearing: the artifact host's
    // frame-ancestors allows claude.ai (and friends) to frame an
    // artifact, so window.top can be a FOREIGN document — a top-addressed
    // protocol would hand page uuids to that ancestor and accept forged
    // "page text" from it, minting attacker HTML as an artifact-origin
    // blob document. The chain never touches the ancestor: requests stop
    // at the root, replies are origin-addressed per hop (never '*' when
    // an origin exists), and both directions are origin-gated (on https
    // a foreign sender's origin can never equal this document's; in
    // opaque contexts — file:// — everything serializes as 'null', where
    // an embedded EXTERNAL frame still fails the gate by carrying its
    // own real origin, and a sandboxed child of such a frame is excluded
    // by the own-child-frames check plus uuid unguessability). Shape is
    // deny-by-default: one request form, one reply form, no error
    // replies.
    // window.origin is the SERIALIZED SECURITY origin ('null' in opaque
    // contexts such as a sandboxed preview iframe) — location.origin is
    // computed from the URL and stays 'https://…' even when the document
    // is sandboxed, which would misgate every opaque chain.
    const OWN_TARGET = /^https?:[/][/]/.test(window.origin || '')
      ? window.origin
      : '*';
    function trustedOrigin(e) {
      if (e.origin === window.origin) return true; // https chains; opaque==opaque
      // file:// trees: Chrome serializes the file document's origin as
      // 'file://' while the blob: documents it mints serialize as 'null',
      // so the two legitimate shapes can never string-match — accept the
      // pair in both directions. https origins never serialize as either,
      // and sender identity (own child frame / direct parent) is checked
      // separately.
      return (
        (e.origin === 'null' &&
          (window.origin === 'file://' ||
            window.location.protocol === 'file:')) ||
        (/^file:/.test(e.origin) && window.origin === 'null')
      );
    }
    // Non-empty only in the root document (nested bundles ship an empty
    // island), so it doubles as the root marker: the root answers from
    // local text and treats a miss as authoritative — never relaying to
    // its (possibly foreign) parent.
    const isPageRoot = pageOrder.length > 0;
    const blobUrls = {};
    const resourceBlobs = {};
    const UUID_SHAPE = /^[0-9a-f]{8}-[0-9a-f]{4}-[0-9a-f]{4}-[0-9a-f]{4}-[0-9a-f]{12}$/;
    const pendingFrames = {}; // uuid -> [{el, frag}] awaiting text for own frames
    const pendingRelays = {}; // uuid -> [childWindow] awaiting text to pass down
    function mountPage(el, frag, text) {
      const pageBlob = new Blob([text], { type: 'text/html' });
      const u = URL.createObjectURL(pageBlob);
      resourceBlobs[u] = pageBlob;
      el.src = u + frag;
    }
    function deliverPage(uuid, text) {
      const frames = pendingFrames[uuid];
      delete pendingFrames[uuid];
      if (frames) for (const f of frames) mountPage(f.el, f.frag, text);
      const relays = pendingRelays[uuid];
      delete pendingRelays[uuid];
      if (relays) {
        for (const cw of relays) {
          try { cw.postMessage({ __bundler_page: uuid, __bundler_text: text }, OWN_TARGET); } catch (err) { /* gone */ }
        }
      }
    }
    function ownFrameWindows() {
      const out = [];
      for (const f of Array.from(document.querySelectorAll('iframe'))) {
        try { if (f.contentWindow) out.push(f.contentWindow); } catch (err) { /* detached */ }
      }
      return out;
    }
    window.addEventListener('message', function (e) {
      const d = e.data;
      if (!d || typeof d !== 'object' || !e.source) return;
      // Origin gate first; the structural checks below (own-child-frames
      // for requests, direct-parent + solicited-uuid for replies, the
      // root's never-relay rule) are what hold in fully opaque chains
      // where origin strings can't discriminate — a sandboxed root's
      // FOREIGN wrapper still fails all three even though both serialize
      // as real-vs-'null' rather than matching.
      if (!trustedOrigin(e)) return;
      if (typeof d.__bundler_need === 'string' && UUID_SHAPE.test(d.__bundler_need)) {
        // Requests are honored only for this document's own child frames.
        if (ownFrameWindows().indexOf(e.source) < 0) return;
        const uuid = d.__bundler_need;
        const text = pageTexts[uuid];
        if (typeof text === 'string') {
          try { e.source.postMessage({ __bundler_page: uuid, __bundler_text: text }, OWN_TARGET); } catch (err) { /* gone */ }
          return;
        }
        if (isPageRoot || window.parent === window) return; // authoritative miss
        const waiting = pendingRelays[uuid];
        if (waiting) {
          if (waiting.indexOf(e.source) < 0) waiting.push(e.source);
          return;
        }
        // Never-answered uuids would otherwise accumulate forever under a
        // request spray; past the cap (far above any real page count) new
        // relays are dropped rather than remembered.
        if (Object.keys(pendingRelays).length >= 128) return;
        pendingRelays[uuid] = [e.source];
        window.parent.postMessage({ __bundler_need: uuid }, OWN_TARGET);
      } else if (
        typeof d.__bundler_page === 'string' &&
        UUID_SHAPE.test(d.__bundler_page) &&
        typeof d.__bundler_text === 'string'
      ) {
        // The shape test is load-bearing beyond tidiness: the solicited
        // check below uses the in operator, which matches prototype keys
        // ('__proto__', 'constructor') — an unshaped key would reach
        // deliverPage and throw, painting the error banner.
        // Text is accepted only from the direct parent — the document
        // that minted this one.
        if (e.source !== window.parent || window.parent === window) return;
        if (!(d.__bundler_page in pendingFrames) && !(d.__bundler_page in pendingRelays)) return;
        deliverPage(d.__bundler_page, d.__bundler_text);
      }
    });

    const uuids = Object.keys(manifest);
    setStatus('Unpacking ' + uuids.length + ' assets...');

    await Promise.all(uuids.map(async (uuid) => {
      const entry = manifest[uuid];
      try {
        const binaryStr = atob(entry.data);
        const bytes = new Uint8Array(binaryStr.length);
        for (let i = 0; i < binaryStr.length; i++) bytes[i] = binaryStr.charCodeAt(i);

        let finalBytes = bytes;
        if (entry.compressed) {
          if (typeof DecompressionStream !== 'undefined') {
            const ds = new DecompressionStream('gzip');
            const writer = ds.writable.getWriter();
            const reader = ds.readable.getReader();
            writer.write(bytes);
            writer.close();
            const chunks = [];
            let totalLen = 0;
            while (true) {
              const { done, value } = await reader.read();
              if (done) break;
              chunks.push(value);
              totalLen += value.length;
            }
            finalBytes = new Uint8Array(totalLen);
            let offset = 0;
            for (const chunk of chunks) { finalBytes.set(chunk, offset); offset += chunk.length; }
          } else {
            console.warn('DecompressionStream not available, asset ' + uuid + ' may not render');
          }
        }

        if (pageSet.has(uuid)) {
          pageTexts[uuid] = new TextDecoder().decode(finalBytes);
          return;
        }
        if (FONT_MIME.test(entry.mime) && MIME_TOKEN.test(entry.mime)) {
          // Strict artifact hosts allow font-src data: but not blob:.
          blobUrls[uuid] = 'data:' + entry.mime + ';base64,' +
            (entry.compressed ? toBase64(finalBytes) : entry.data);
        } else {
          const blob = new Blob([finalBytes], { type: entry.mime });
          blobUrls[uuid] = URL.createObjectURL(blob);
          resourceBlobs[blobUrls[uuid]] = blob;
        }
      } catch (err) {
        console.error('Failed to decode asset ' + uuid + ':', err);
        const blob = new Blob([], { type: entry.mime });
        blobUrls[uuid] = URL.createObjectURL(blob);
        resourceBlobs[blobUrls[uuid]] = blob;
      }
    }));

    const extResEl = document.querySelector('script[type="__bundler/ext_resources"]');
    const extResources = extResEl ? JSON.parse(extResEl.textContent) : [];
    const resourceMap = {};
    for (const entry of extResources) {
      if (blobUrls[entry.uuid]) resourceMap[entry.id] = blobUrls[entry.uuid];
    }

    // Artifact-host CSP (connect-src 'self') refuses fetch() of blob: URLs —
    // consumers read these Blobs directly. Survives the swap like the error sink.
    window.__resourceBlobs = resourceBlobs;

    setStatus('Rendering...');
    // Page uuids have no blob here — they ride inside about:blank#<uuid>
    // frame markers the pass below resolves after the swap.
    for (const uuid of uuids) {
      if (pageSet.has(uuid)) continue;
      template = template.split(uuid).join(blobUrls[uuid]);
    }

    // Strip integrity + crossorigin — blob URLs from a file:// document inherit
    // a null origin, so crossorigin forces a CORS fetch that SRI then rejects.
    // The manifest bytes are ours; SRI protects against CDN compromise, not this.
    template = template.replace(/\s+integrity="[^"]*"/gi, '').replace(/\s+crossorigin="[^"]*"/gi, '');

    const resourceScript = '<script>window.__resources = ' +
      JSON.stringify(resourceMap).replace(/<\//g, '<\\/') +
      ';</' + 'script>';
    // Inject after <head> so the DOCTYPE stays first; prepending the script
    // would push the parser into quirks mode. DOMParser always emits a <head>
    // (synthesizing one if the source HTML omitted it) but may carry
    // attributes through, so match the full opening tag. slice() rather than
    // replace() keeps us clear of $-pattern substitution in resourceScript.
    const headOpen = template.match(/<head[^>]*>/i);
    if (headOpen) {
      const i = headOpen.index + headOpen[0].length;
      template = template.slice(0, i) + resourceScript + template.slice(i);
    }

    // Parse the template and swap the root element. Scripts inserted via
    // DOMParser/replaceWith are inert per spec — re-create each with
    // createElement so they execute, awaiting onload for src scripts to
    // preserve ordering (React before ReactDOM before Babel before text/babel).
    const doc = new DOMParser().parseFromString(template, 'text/html');
    document.documentElement.replaceWith(doc.documentElement);

    // Resolve page-frame markers: mint this document's own blob for each
    // framed page — from local text when this is the root, otherwise by
    // asking the direct parent over the relay protocol above. An
    // unanswered request leaves the frame on about:blank, the same
    // degraded state as a refused embed.
    {
      const MARKER = /^about:blank#([0-9a-f]{8}-[0-9a-f]{4}-[0-9a-f]{4}-[0-9a-f]{4}-[0-9a-f]{12})(#.*)?$/;
      const needed = [];
      for (const el of Array.from(document.querySelectorAll('iframe'))) {
        const m = MARKER.exec(el.getAttribute('src') || '');
        if (!m) continue;
        const text = pageTexts[m[1]];
        if (typeof text === 'string') {
          mountPage(el, m[2] || '', text);
        } else if (window.parent !== window && !isPageRoot) {
          const had = pendingFrames[m[1]];
          (pendingFrames[m[1]] = had || []).push({ el: el, frag: m[2] || '' });
          if (!had) needed.push(m[1]);
        }
      }
      for (const uuid of needed) {
        window.parent.postMessage({ __bundler_need: uuid }, OWN_TARGET);
      }
    }

    const dead = Array.from(document.scripts);
    for (const old of dead) {
      const s = document.createElement('script');
      for (const a of old.attributes) s.setAttribute(a.name, a.value);
      s.textContent = old.textContent;
      // text/babel scripts with a src: read and inline. transformScriptTags
      // does XHR against the src, but blob:null/ from a file:// origin is
      // silently dropped. Inlining makes it a plain inline babel script,
      // which transformScriptTags handles unconditionally.
      if ((s.type === 'text/babel' || s.type === 'text/jsx') && s.src) {
        const pre = resourceBlobs[s.src.split('#')[0]];
        s.textContent = pre ? await pre.text() : await (await fetch(s.src)).text();
        s.removeAttribute('src');
      }
      const p = s.src ? new Promise(function(r) { s.onload = s.onerror = r; }) : null;
      old.replaceWith(s);
      if (p) await p;
    }
    // Babel standalone auto-transforms type=text/babel on DOMContentLoaded,
    // which fired before we swapped the document. Trigger manually if present.
    if (window.Babel && typeof window.Babel.transformScriptTags === 'function') {
      window.Babel.transformScriptTags();
    }
  } catch (err) {
    setStatus('Error unpacking: ' + err.message);
    console.error('Bundle unpack error:', err);
  }
});

5vw,62px);margin:8px 0 0;line-height:1\">TRAILER OR TENT<\u002Fh2>\n    <\u002Fdiv>\n    <div style=\"display:grid;grid-template-columns:repeat(auto-fit,minmax(340px,1fr));gap:28px\">\n      <div style=\"background:#fff;border:5px solid #000;box-shadow:12px 12px 0 #FF10B6\">\n        <div style=\"height:260px;border-bottom:5px solid #000;position:relative\">\n          <div style=\"position:absolute;inset:0;overflow:hidden\"><img src=\"images/trailer.webp\" alt=\"\" style=\"position:absolute;left:50.00%;top:34.58%;transform:translate(-50%,-50%);min-width:100%;min-height:100%;width:auto;height:auto;max-width:none\"><\u002Fdiv>\n        <\u002Fdiv>\n        <div style=\"padding:26px\">\n          <h3 style=\"font-family:'Bungee',cursive;font-size:27px;margin:0\">THE TRAILER<\u002Fh3>\n          <p style=\"color:#444;font-size:16px;line-height:1.55;margin:12px 0 18px\">Our full mobile bar, towed to you. Best for outdoor events — festivals, ball games, graduations, church picnics, company lots. Fully self-contained: we bring water, power and everything else.<\u002Fp>\n          <div style=\"display:flex;flex-wrap:wrap;gap:8px\">\n            <span style=\"background:#0B0B0B;color:#fff;font-size:13px;font-weight:700;padding:7px 12px\">Needs ~20×12 ft flat space<\u002Fspan>\n            <span style=\"background:#0B0B0B;color:#fff;font-size:13px;font-weight:700;padding:7px 12px\">Full menu<\u002Fspan>\n            <span style=\"background:#0B0B0B;color:#fff;font-size:13px;font-weight:700;padding:7px 12px\">Outdoors<\u002Fspan>\n          <\u002Fdiv>\n        <\u002Fdiv>\n      <\u002Fdiv>\n      <div style=\"background:#fff;border:5px solid #000;box-shadow:12px 12px 0 #1B58F0\">\n        <div style=\"height:260px;border-bottom:5px solid #000;position:relative\">\n          <div style=\"position:absolute;inset:0;overflow:hidden\"><img src=\"images/tent.webp\" alt=\"\" style=\"position:absolute;left:50.00%;top:46.40%;transform:translate(-50%,-50%);min-width:100%;min-height:100%;width:auto;height:auto;max-width:none\"><\u002Fdiv>\n        <\u002Fdiv>\n        <div style=\"padding:26px\">\n          <h3 style=\"font-family:'Bungee',cursive;font-size:27px;margin:0\">THE TENT<\u002Fh3>\n          <p style=\"color:#444;font-size:16px;line-height:1.55;margin:12px 0 18px\">When the trailer can't fit — gymnasiums, cafeterias, banquet halls, office lobbies. Same drinks, same energy, packed into a tidy pop-up bar we set up and tear down ourselves.<\u002Fp>\n          <div style=\"display:flex;flex-wrap:wrap;gap:8px\">\n            <span style=\"background:#0B0B0B;color:#fff;font-size:13px;font-weight:700;padding:7px 12px\">Needs ~10×10 ft indoors<\u002Fspan>\n            <span style=\"background:#0B0B0B;color:#fff;font-size:13px;font-weight:700;padding:7px 12px\">Standard outlet<\u002Fspan>\n            <span style=\"background:#0B0B0B;color:#fff;font-size:13px;font-weight:700;padding:7px 12px\">Indoors<\u002Fspan>\n          <\u002Fdiv>\n        <\u002Fdiv>\n      <\u002Fdiv>\n    <\u002Fdiv>\n    <div style=\"display:grid;grid-template-columns:repeat(auto-fit,minmax(200px,1fr));gap:18px;margin-top:34px\">\n      <div style=\"background:#BFE536;border:4px solid #000;padding:20px\"><div style=\"font-family:'Bungee',cursive;font-size:17px\">Birthdays<\u002Fdiv><div style=\"font-size:15px;font-weight:500;margin-top:6px\">Kids' parties, sweet 16s, milestone bashes<\u002Fdiv><\u002Fdiv>\n      <div style=\"background:#fff;border:4px solid #000;padding:20px\"><div style=\"font-family:'Bungee',cursive;font-size:17px\">Weddings<\u002Fdiv><div style=\"font-size:15px;font-weight:500;margin-top:6px\">Late-night sips, morning-after coffee<\u002Fdiv><\u002Fdiv>\n      <div style=\"background:#fff;border:4px solid #000;padding:20px\"><div style=\"font-family:'Bungee',cursive;font-size:17px\">Work &amp; Church<\u002Fdiv><div style=\"font-size:15px;font-weight:500;margin-top:6px\">Staff appreciation, youth nights, open houses<\u002Fdiv><\u002Fdiv>\n      <div style=\"background:#fff;border:4px solid #000;padding:20px\"><div style=\"font-family:'Bungee',cursive;font-size:17px\">Sports &amp; Festivals<\u002Fdiv><div style=\"font-size:15px;font-weight:500;margin-top:6px\">Tournaments, fairs, vendor rows<\u002Fdiv><\u002Fdiv>\n    <\u002Fdiv>\n  <\u002Fdiv>\n<\u002Fsection>\n\n<section id=\"fundraisers\" data-screen-label=\"Fundraisers\" style=\"position:relative;background:#1B58F0;padding:84px 20px;scroll-margin-top:80px;overflow:hidden\">\n  <div style=\"position:absolute;inset:0;opacity:.35;background-image:radial-gradient(#ffffff33 1.5px, transparent 1.5px);background-size:26px 26px;pointer-events:none\"><\u002Fdiv>\n  <div style=\"position:relative;max-width:1100px;margin:0 auto\">\n    <div style=\"text-align:center\">\n      <div style=\"font-family:'Permanent Marker',cursive;color:#BFE536;font-size:20px\">for the schools<\u002Fdiv>\n      <h2 style=\"font-family:'Bungee',cursive;color:#fff;font-size:clamp(34px,5.5vw,62px);margin:8px 0 0;line-height:1;text-shadow:5px 5px 0 #0B0B0B\">SIP FOR A CAUSE<\u002Fh2>\n      <p style=\"color:#fff;max-width:640px;margin:20px auto 0;font-size:17px;line-height:1.55;font-weight:500;text-wrap:pretty\">No order forms. No boxes of wrapping paper in your trunk. We park the trailer at your school, sell drinks for a few hours, and a share of every single sip goes straight back to your program.<\u002Fp>\n    <\u002Fdiv>\n    <div style=\"display:grid;grid-template-columns:repeat(auto-fit,minmax(240px,1fr));gap:20px;margin-top:44px\">\n      <div style=\"background:#fff;border:5px solid #000;box-shadow:8px 8px 0 #0B0B0B;padding:24px\">\n        <div style=\"font-family:'Bungee',cursive;color:#FF10B6;font-size:34px\">01<\u002Fdiv>\n        <div style=\"font-family:'Bungee',cursive;font-size:19px;margin-top:6px\">Pick a date<\u002Fdiv>\n        <p style=\"color:#555;font-size:15px;line-height:1.5;margin:8px 0 0\">Game night, conferences, field day, open house — anywhere there's already a crowd.<\u002Fp>\n      <\u002Fdiv>\n      <div style=\"background:#fff;border:5px solid #000;box-shadow:8px 8px 0 #0B0B0B;padding:24px\">\n        <div style=\"font-family:'Bungee',cursive;color:#7A2FD4;font-size:34px\">02<\u002Fdiv>\n        <div style=\"font-family:'Bungee',cursive;font-size:19px;margin-top:6px\">We bring it all<\u002Fdiv>\n        <p style=\"color:#555;font-size:15px;line-height:1.5;margin:8px 0 0\">Trailer or tent, staff, supplies, signage in your school colors. You just spread the word.<\u002Fp>\n      <\u002Fdiv>\n      <div style=\"background:#fff;border:5px solid #000;box-shadow:8px 8px 0 #0B0B0B;padding:24px\">\n        <div style=\"font-family:'Bungee',cursive;color:#F7941E;font-size:34px\">03<\u002Fdiv>\n        <div style=\"font-family:'Bungee',cursive;font-size:19px;margin-top:6px\">You get a check<\u002Fdiv>\n        <p style=\"color:#555;font-size:15px;line-height:1.5;margin:8px 0 0\">A percentage of sales, paid out within a week. No upfront cost to your school, ever.<\u002Fp>\n      <\u002Fdiv>\n    <\u002Fdiv>\n    <div style=\"background:#BFE536;border:5px solid #000;box-shadow:10px 10px 0 #0B0B0B;padding:26px;margin-top:34px;display:flex;gap:22px;align-items:center;flex-wrap:wrap;justify-content:space-between\">\n      <div style=\"max-width:620px\">\n        <div style=\"font-family:'Bungee',cursive;font-size:20px\">Bands, teams, PTOs, cheer, robotics, senior trips<\u002Fdiv>\n        <p style=\"margin:8px 0 0;font-size:15.5px;font-weight:500;line-height:1.5\">If it's a Jackson County school group raising money, we want to help. Tell us your goal in the form and we'll come back with a plan and a percentage.<\u002Fp>\n      <\u002Fdiv>\n      <a href=\"#book\" style=\"background:#0B0B0B;color:#fff;font-family:'Bungee',cursive;font-size:16px;padding:17px 26px;border:4px solid #000;box-shadow:5px 5px 0 #FF10B6\" style-hover=\"transform:translate(2px,2px);box-shadow:2px 2px 0 #FF10B6\">PLAN A FUNDRAISER<\u002Fa>\n    <\u002Fdiv>\n  <\u002Fdiv>\n<\u002Fsection>\n\n<section id=\"book\" data-screen-label=\"Book Us\" style=\"background:#0B0B0B;padding:84px 20px;scroll-margin-top:80px\">\n  <div style=\"max-width:1240px;margin:0 auto;display:grid;grid-template-columns:repeat(auto-fit,minmax(360px,1fr));gap:44px;align-items:start\">\n    <div>\n      <div style=\"font-family:'Permanent Marker',cursive;color:#FF10B6;font-size:20px\">let's do this<\u002Fdiv>\n      <h2 style=\"font-family:'Bungee',cursive;color:#fff;font-size:clamp(34px,5vw,58px);margin:8px 0 0;line-height:1;text-shadow:5px 5px 0 #1B58F0\">BOOK THE<br>TRAILER<\u002Fh2>\n      <p style=\"color:#CFCFCF;font-size:17px;line-height:1.55;margin:22px 0 0;max-width:420px\">Tell us a little about your event and we'll get back to you within 48 hours with availability and a quote. Booking 2–3 weeks out is ideal; last-minute asks are always worth a text.<\u002Fp>\n      <div style=\"display:flex;flex-direction:column;gap:12px;margin-top:28px\">\n        <a href=\"tel:5174032234\" style=\"color:#fff;font-family:'Bungee',cursive;font-size:20px\" style-hover=\"color:#BFE536\">517-403-2234<\u002Fa>\n        <a href=\"mailto:sipsternation@gmail.com\" style=\"color:#BFE536;font-weight:600;font-size:17px\" style-hover=\"color:#fff\">sipsternation@gmail.com<\u002Fa>\n      <\u002Fdiv>\n      <div style=\"margin-top:28px;border:4px solid #FF10B6;padding:18px;max-width:420px\">\n        <div style=\"color:#FF10B6;font-family:'Bungee',cursive;font-size:15px\">SERVICE AREA<\u002Fdiv>\n        <p style=\"color:#DDD;font-size:15px;line-height:1.5;margin:8px 0 0\">All of Jackson County plus about 25 miles past the line. Farther out? Ask — we travel for the right event.<\u002Fp>\n      <\u002Fdiv>\n    <\u002Fdiv>\n\n    <sc-if value=\"{{ notSent }}\" hint-placeholder-val=\"{{ true }}\">\n      <form sc-camel-on-submit=\"{{ submit }}\" style=\"background:#fff;border:5px solid #000;box-shadow:14px 14px 0 #BFE536;padding:30px\">\n        <div style=\"display:grid;grid-template-columns:repeat(2,minmax(0,1fr));gap:18px\">\n          <label style=\"display:flex;flex-direction:column;gap:6px;min-width:0;grid-column:span 2\">\n            <span style=\"font-weight:700;font-size:13px;letter-spacing:.06em;text-transform:uppercase\">Your name<\u002Fspan>\n            <input name=\"name\" required=\"required\" placeholder=\"Jane Sipster\" style=\"border:3px solid #000;padding:13px;font-size:16px;background:#F6F4EF;width:100%;min-width:0\">\n          <\u002Flabel>\n          <label style=\"display:flex;flex-direction:column;gap:6px;min-width:0\">\n            <span style=\"font-weight:700;font-size:13px;letter-spacing:.06em;text-transform:uppercase\">Email<\u002Fspan>\n            <input name=\"email\" type=\"email\" required=\"required\" placeholder=\"you@email.com\" style=\"border:3px solid #000;padding:13px;font-size:16px;background:#F6F4EF;width:100%;min-width:0\">\n          <\u002Flabel>\n          <label style=\"display:flex;flex-direction:column;gap:6px;min-width:0\">\n            <span style=\"font-weight:700;font-size:13px;letter-spacing:.06em;text-transform:uppercase\">Phone<\u002Fspan>\n            <input name=\"phone\" type=\"tel\" placeholder=\"517-555-0134\" style=\"border:3px solid #000;padding:13px;font-size:16px;background:#F6F4EF;width:100%;min-width:0\">\n          <\u002Flabel>\n          <label style=\"display:flex;flex-direction:column;gap:6px;min-width:0\">\n            <span style=\"font-weight:700;font-size:13px;letter-spacing:.06em;text-transform:uppercase\">Event date<\u002Fspan>\n            <input name=\"date\" type=\"date\" style=\"border:3px solid #000;padding:13px;font-size:16px;background:#F6F4EF;width:100%;min-width:0\">\n          <\u002Flabel>\n          <label style=\"display:flex;flex-direction:column;gap:6px;min-width:0\">\n            <span style=\"font-weight:700;font-size:13px;letter-spacing:.06em;text-transform:uppercase\">Guests (approx.)<\u002Fspan>\n            <input name=\"headcount\" type=\"number\" min=\"1\" placeholder=\"150\" style=\"border:3px solid #000;padding:13px;font-size:16px;background:#F6F4EF;width:100%;min-width:0\">\n          <\u002Flabel>\n          <label style=\"display:flex;flex-direction:column;gap:6px;min-width:0\">\n            <span style=\"font-weight:700;font-size:13px;letter-spacing:.06em;text-transform:uppercase\">Event type<\u002Fspan>\n            <sc-raw-select name=\"type\" style=\"border:3px solid #000;padding:13px;font-size:16px;background:#F6F4EF;width:100%;min-width:0\">\n              <option>School fundraiser<\u002Foption>\n              <option>Birthday party<\u002Foption>\n              <option>Wedding<\u002Foption>\n              <option>Church or community event<\u002Foption>\n              <option>Corporate / staff appreciation<\u002Foption>\n              <option>Sports tournament or festival<\u002Foption>\n              <option>Something else<\u002Foption>\n            <\u002Fsc-raw-select>\n          <\u002Flabel>\n          <label style=\"display:flex;flex-direction:column;gap:6px;min-width:0\">\n            <span style=\"font-weight:700;font-size:13px;letter-spacing:.06em;text-transform:uppercase\">Setup<\u002Fspan>\n            <sc-raw-select name=\"setup\" style=\"border:3px solid #000;padding:13px;font-size:16px;background:#F6F4EF;width:100%;min-width:0\">\n              <option>Trailer (outdoor)<\u002Foption>\n              <option>Tent (indoor)<\u002Foption>\n              <option>Not sure — help me pick<\u002Foption>\n            <\u002Fsc-raw-select>\n          <\u002Flabel>\n          <label style=\"display:flex;flex-direction:column;gap:6px;min-width:0;grid-column:span 2\">\n            <span style=\"font-weight:700;font-size:13px;letter-spacing:.06em;text-transform:uppercase\">Where is it?<\u002Fspan>\n            <input name=\"location\" placeholder=\"School or venue name, town\" style=\"border:3px solid #000;padding:13px;font-size:16px;background:#F6F4EF;width:100%;min-width:0\">\n          <\u002Flabel>\n          <label style=\"display:flex;flex-direction:column;gap:6px;min-width:0;grid-column:span 2\">\n            <span style=\"font-weight:700;font-size:13px;letter-spacing:.06em;text-transform:uppercase\">Tell us more<\u002Fspan>\n            <textarea name=\"notes\" rows=\"4\" placeholder=\"Timing, theme, fundraising goal, anything else we should know.\" style=\"border:3px solid #000;padding:13px;font-size:16px;background:#F6F4EF;width:100%;min-width:0;resize:vertical\"><\u002Ftextarea>\n          <\u002Flabel>\n        <\u002Fdiv>\n        <button type=\"submit\" style=\"width:100%;margin-top:22px;background:#FF10B6;color:#fff;font-family:'Bungee',cursive;font-size:18px;padding:19px;border:4px solid #000;box-shadow:6px 6px 0 #0B0B0B;cursor:pointer\" style-hover=\"background:#0B0B0B;color:#BFE536\">SEND IT<\u002Fbutton>\n        <p style=\"text-align:center;color:#777;font-size:13px;margin:14px 0 0\">We reply within 48 hours. Prefer to text? 517-403-2234.<\u002Fp>\n      <\u002Fform>\n    <\u002Fsc-if>\n\n    <sc-if value=\"{{ sent }}\">\n      <div style=\"background:#BFE536;border:5px solid #000;box-shadow:14px 14px 0 #FF10B6;padding:56px 34px;text-align:center\">\n        <div style=\"font-family:'Permanent Marker',cursive;font-size:22px\">well hey there<\u002Fdiv>\n        <h3 style=\"font-family:'Bungee',cursive;font-size:36px;margin:10px 0 0;line-height:1.05\">REQUEST SENT!<\u002Fh3>\n        <p style=\"font-size:17px;line-height:1.55;margin:16px auto 0;max-width:420px;font-weight:500\">Jennifer or Ashley will get back to you within 48 hours. In the meantime, go follow us — that's where the weekly schedule lives.<\u002Fp>\n        <div style=\"display:flex;gap:12px;justify-content:center;flex-wrap:wrap;margin-top:24px\">\n          <a href=\"https://instagram.com/sipsternation\" target=\"_blank\" rel=\"noopener\" style=\"background:#0B0B0B;color:#fff;font-family:'Bungee',cursive;font-size:14px;padding:14px 20px;border:3px solid #000\">@SIPSTERNATION<\u002Fa>\n          <button sc-camel-on-click=\"{{ reset }}\" style=\"background:#fff;color:#000;font-family:'Bungee',cursive;font-size:14px;padding:14px 20px;border:3px solid #000;cursor:pointer\">SEND ANOTHER<\u002Fbutton>\n        <\u002Fdiv>\n      <\u002Fdiv>\n    <\u002Fsc-if>\n  <\u002Fdiv>\n<\u002Fsection>\n\n<section id=\"about\" data-screen-label=\"About\" style=\"background:#F6F4EF;padding:84px 20px;scroll-margin-top:80px\">\n  <div style=\"max-width:1240px;margin:0 auto;display:grid;grid-template-columns:repeat(auto-fit,minmax(340px,1fr));gap:50px;align-items:center\">\n    <div style=\"position:relative\">\n      <div style=\"border:5px solid #000;box-shadow:14px 14px 0 #FF10B6;height:440px;position:relative\">\n        <div style=\"position:absolute;inset:0;overflow:hidden\"><img src=\"images/founders.webp\" alt=\"\" style=\"position:absolute;left:50.00%;top:63.81%;transform:translate(-50%,-50%);min-width:100%;min-height:100%;width:auto;height:auto;max-width:none\"><\u002Fdiv>\n      <\u002Fdiv>\n      <div style=\"position:absolute;bottom:-22px;left:-22px;background:#BFE536;border:4px solid #000;padding:12px 18px;transform:rotate(-3deg);font-family:'Bungee',cursive;font-size:15px\">EST. OCTOBER 2025<\u002Fdiv>\n    <\u002Fdiv>\n    <div>\n      <div style=\"font-family:'Permanent Marker',cursive;color:#7A2FD4;font-size:20px\">the two behind the window<\u002Fdiv>\n      <h2 style=\"font-family:'Bungee',cursive;font-size:clamp(32px,4.6vw,54px);margin:8px 0 0;line-height:1.02\">JENNIFER<br>&amp; ASHLEY<\u002Fh2>\n      <p style=\"color:#333;font-size:17px;line-height:1.6;margin:22px 0 0;text-wrap:pretty\">Hi everyone! We're Jennifer Wineland and Ashley Maurer, the proud new owners of Sipster Dirty Soda Shop — serving dirty soda, loaded water, iced coffee and specialty seasonal drinks to your local event! Both of us were born and raised right here in the area, and we're so excited to bring something fun and refreshing to our community.<\u002Fp>\n
